<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="aspnet-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#512BD4"/>
      <stop offset="100%" stop-color="#7014B7"/>
    </linearGradient>
    <linearGradient id="aspnet-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#64FFDA"/>
      <stop offset="100%" stop-color="#00BCF2"/>
    </linearGradient>
  </defs>
  <!-- Outer Rounded Hexagon / Card -->
  <rect x="10" y="10" width="108" height="108" rx="26" fill="url(#aspnet-bg)"/>
  <rect x="10" y="10" width="108" height="108" rx="26" fill="none" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="2.5"/>
  
  <!-- Modern ASP.NET Code Web Emblem -->
  <!-- Left angle bracket < -->
  <path d="M42 38 L26 54 L42 70" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Right angle bracket > -->
  <path d="M86 38 L102 54 L86 70" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Center Slash / -->
  <path d="M68 34 L60 74" fill="none" stroke="url(#aspnet-accent)" stroke-width="5" stroke-linecap="round"/>
  
  <!-- Core .NET Dot -->
  <circle cx="48" cy="54" r="3.5" fill="#64FFDA"/>

  <!-- ASP.NET Banner -->
  <rect x="16" y="82" width="96" height="28" rx="8" fill="#121024" fill-opacity="0.9"/>
  <text x="64" y="101" fill="#FFFFFF" font-family="'Inter', 'Segoe UI', -apple-system, sans-serif" font-weight="900" font-size="14.5" text-anchor="middle" letter-spacing="0.8">ASP.NET</text>
</svg>
